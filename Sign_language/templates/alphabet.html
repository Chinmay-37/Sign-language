<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Recognition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #recognized_text {
            min-height: 80px;
            font-size: 2rem;
        }
        #current_letter {
            min-height: 60px;
            font-size: 3rem;
            color: #FFA500; /* Orange */
        }
        .progress-bar {
            transition: width 0.05s linear;
            background-color: #4CAF50;
        }
        .btn-recognition {
            font-size: 1.2rem;
            padding: 10px 25px;
        }
    </style>
</head>
<body style="background-color: #1e2935">
    <div class="container text-center mt-4">
        <h1 class="text-white mb-4">ASL Alphabet Recognition</h1>
        <p class="text-light mb-4">Hold each sign steady for <span class="fw-bold">3 seconds</span> to add to the word</p>
        
        <div class="progress mb-4" style="height: 25px;">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
        </div>
        
        <div id="current_letter" class="fw-bold my-4"></div>
        <div id="recognized_text" class="fw-bold mb-5 text-success"></div>
        
        <button id="recognitionBtn" class="btn btn-danger btn-recognition me-2">Start</button>
        <button id="resetBtn" class="btn btn-secondary btn-recognition" disabled>Reset</button>
    </div>

    <script>
        const DETECTION_TIME = 3; // 3 seconds threshold
        let recognitionInterval;
        let progressInterval;
        let progressStartTime;
        
        document.getElementById('recognitionBtn').addEventListener('click', startRecognition);
        document.getElementById('resetBtn').addEventListener('click', resetRecognition);

        function startRecognition() {
            const btn = document.getElementById('recognitionBtn');
            btn.disabled = true;
            btn.textContent = "Processing...";
            
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('recognized_text').textContent = "";
            document.getElementById('current_letter').textContent = "Waiting for sign...";
            
            fetch('/start_alphabet_recognition', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'recognition started') {
                        startProgressBar();
                        recognitionInterval = setInterval(checkRecognitionResult, 300);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    resetUI();
                });
        }

        function startProgressBar() {
            clearInterval(progressInterval);
            progressStartTime = Date.now();
            
            progressInterval = setInterval(() => {
                const elapsed = (Date.now() - progressStartTime) / 1000;
                const progress = Math.min(100, (elapsed / DETECTION_TIME) * 100);
                document.getElementById('progressBar').style.width = `${progress}%`;
                
                if (progress >= 100) {
                    progressStartTime = Date.now(); // Reset for next letter
                }
            }, 50);
        }

        function checkRecognitionResult() {
            fetch('/get_alphabet_result')
                .then(response => response.json())
                .then(data => {
                    if (data.recognized_alphabet) {
                        document.getElementById('recognized_text').textContent = data.recognized_alphabet;
                    }
                    if (data.status === 'ready') {
                        clearIntervals();
                        document.getElementById('recognitionBtn').disabled = false;
                        document.getElementById('recognitionBtn').textContent = "Start";
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function resetRecognition() {
            clearIntervals();
            resetUI();
            fetch('/reset_alphabet_recognition', { method: 'POST' });
        }

        function clearIntervals() {
            clearInterval(recognitionInterval);
            clearInterval(progressInterval);
        }

        function resetUI() {
            document.getElementById('progressBar').style.width = "0%";
            document.getElementById('recognized_text').textContent = "";
            document.getElementById('current_letter').textContent = "";
            document.getElementById('recognitionBtn').disabled = false;
            document.getElementById('recognitionBtn').textContent = "Start";
            document.getElementById('resetBtn').disabled = true;
        }
    </script>
</body>
</html>
